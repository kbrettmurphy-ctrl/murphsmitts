<header class="site-header" data-site-header>
  <div class="container header-inner">

    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Home">
      <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="Murph’s Mitt Maintenance logo">
      <span class="brand-text"><span>MURPH'S MITT</span><span>MAINTENANCE</span></span>
    </a>

    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}" class="{% if page.nav == 'home' %}active{% endif %}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/services/' | relative_url }}" class="{% if page.nav == 'services' %}active{% endif %}"{% if page.nav == 'services' %} aria-current="page"{% endif %}>Services</a>
      <a href="{{ '/process/' | relative_url }}" class="{% if page.nav == 'process' %}active{% endif %}"{% if page.nav == 'process' %} aria-current="page"{% endif %}>Process</a>
      <a href="{{ '/gallery/' | relative_url }}" class="{% if page.nav == 'gallery' %}active{% endif %}"{% if page.nav == 'gallery' %} aria-current="page"{% endif %}>Gallery</a>
      <a href="{{ '/glove-care/' | relative_url }}" class="{% if page.nav == 'glove-care' %}active{% endif %}"{% if page.nav == 'glove-care' %} aria-current="page"{% endif %}>Glove Articles</a>
      <a href="{{ '/for-sale/' | relative_url }}" class="{% if page.nav == 'for-sale' %}active{% endif %}"{% if page.nav == 'for-sale' %} aria-current="page"{% endif %}>Gloves For Sale</a>
      <a href="{{ '/baseball-glove-relacing/#faq' | relative_url }}" class="{% if page.nav == 'faq' %}active{% endif %}"{% if page.nav == 'faq' %} aria-current="page"{% endif %}>FAQ</a>
      <a href="{{ '/about/' | relative_url }}" class="{% if page.nav == 'about' %}active{% endif %}"{% if page.nav == 'about' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/contact/' | relative_url }}" class="{% if page.nav == 'contact' %}active{% endif %}"{% if page.nav == 'contact' %} aria-current="page"{% endif %}>Contact</a>
    </nav>

    <button class="menu-btn" type="button" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false" data-menu-open>
      <span></span><span></span><span></span>
    </button>

  </div>
</header>

<!-- Mobile menu overlay -->

  <div class="mobile-menu-inner">
    <div class="mobile-menu-top">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Home">
        <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="Murph’s Mitt Maintenance logo">
        <span class="brand-text"><span>MURPH'S MITT</span><span>MAINTENANCE</span></span>
      </a>
      <button class="mobile-close" type="button" aria-label="Close menu" data-menu-close>×</button>
    </div>

    <nav class="mobile-links" aria-label="Mobile navigation">
      <a href="{{ '/' | relative_url }}" class="{% if page.nav == 'home' %}active{% endif %}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/services/' | relative_url }}" class="{% if page.nav == 'services' %}active{% endif %}"{% if page.nav == 'services' %} aria-current="page"{% endif %}>Services</a>
      <a href="{{ '/process/' | relative_url }}" class="{% if page.nav == 'process' %}active{% endif %}"{% if page.nav == 'process' %} aria-current="page"{% endif %}>Process</a>
      <a href="{{ '/gallery/' | relative_url }}" class="{% if page.nav == 'gallery' %}active{% endif %}"{% if page.nav == 'gallery' %} aria-current="page"{% endif %}>Gallery</a>
      <a href="{{ '/glove-care/' | relative_url }}" class="{% if page.nav == 'glove-care' %}active{% endif %}"{% if page.nav == 'glove-care' %} aria-current="page"{% endif %}>Glove Articles</a>
      <a href="{{ '/for-sale/' | relative_url }}" class="{% if page.nav == 'for-sale' %}active{% endif %}"{% if page.nav == 'for-sale' %} aria-current="page"{% endif %}>Gloves For Sale</a>
      <a href="{{ '/baseball-glove-relacing/#faq' | relative_url }}" class="{% if page.nav == 'faq' %}active{% endif %}"{% if page.nav == 'faq' %} aria-current="page"{% endif %}>FAQ</a>
      <a href="{{ '/about/' | relative_url }}" class="{% if page.nav == 'about' %}active{% endif %}"{% if page.nav == 'about' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/contact/' | relative_url }}" class="{% if page.nav == 'contact' %}active{% endif %}"{% if page.nav == 'contact' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
  </div>
</div>
