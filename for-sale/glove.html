---
layout: default
title: Glove Details
description: Restored glove listing from Murph's Mitt Maintenance.
nav: for-sale
body_class: for-sale
---

<main class="page">
  <div class="container">
    <div id="gloveDetail">
      Loading...
    </div>
  </div>
</main>

<script>
  async function loadGlove() {
    const slug =
      new URLSearchParams(location.search)
        .get("slug");

    const container =
      document.getElementById("gloveDetail");

    if (!slug) {
      container.innerHTML = "<p>Glove not found.</p>";
      return;
    }

    try {
      const resp = await fetch("/api/gloves-for-sale");
      const data = await resp.json();

      const glove =
        data.gloves.find(g => g.slug === slug);

      if (!glove) {
        container.innerHTML = "<p>Glove not found.</p>";
        return;
      }

      container.innerHTML = `
        <article class="sale-detail">
      
          <div class="sale-detail-gallery">
            <img
              id="saleDetailMainPhoto"
              class="sale-detail-main-img"
              src="${glove.primaryPhoto || ""}"
              alt="${glove.title}"
            >
      
            <div class="sale-detail-thumbs">
              ${(glove.photos || []).map(photo => `
                <button
                  type="button"
                  class="sale-detail-thumb"
                  onclick="document.getElementById('saleDetailMainPhoto').src='${photo.url}'"
                >
                  <img src="${photo.url}" alt="">
                </button>
              `).join("")}
            </div>
          </div>
      
          <section class="sale-detail-info">
            <h1>${glove.title}</h1>
      
            <p class="sale-detail-price">
              $${Number(glove.price).toFixed(2)}
            </p>
      
            <div class="glove-specs">
              <div><strong>Brand:</strong> ${glove.brand}</div>
              <div><strong>Model:</strong> ${glove.model}</div>
              <div><strong>Size:</strong> ${glove.gloveSize ? `${glove.gloveSize}"` : ""}</div>
              <div><strong>Position:</strong> ${glove.position}</div>
              <div><strong>Web:</strong> ${glove.web}</div>
              <div><strong>Throw Hand:</strong> ${glove.throwHand}</div>
              <div><strong>Condition:</strong> ${glove.condition}</div>
            </div>
      
            <div class="sale-detail-description">
              ${glove.description || ""}
            </div>
            
            <div class="sale-detail-actions">
              ${
                glove.purchaseUrl
                  ? `<a class="btn btn-primary" href="${glove.purchaseUrl}" target="_blank" rel="noopener">Buy This Glove</a>`
                  : `<a class="btn btn-primary" href="/contact/?glove=${encodeURIComponent(glove.title)}">Ask About This Glove</a>`
                }
            
              <a class="btn btn-secondary" href="/for-sale/">
                Back to Gloves
              </a>
            </div>
          </section>
      
        </article>
      `;
    } catch (err) {
      container.innerHTML = `<p>${err.message}</p>`;
    }
  }

  loadGlove();
</script>
