---
layout: default
title: Glove Details
description: Restored glove listing from Murph's Mitt Maintenance.
nav: for-sale
body_class: for-sale
---

<main class="page">
  <div class="container">
    <div id="gloveDetail">
      Loading...
    </div>
  </div>
</main>

<script>
  async function loadGlove() {
    const slug =
      new URLSearchParams(location.search)
        .get("slug");

    const container =
      document.getElementById("gloveDetail");

    if (!slug) {
      container.innerHTML = "<p>Glove not found.</p>";
      return;
    }

    try {
      const resp = await fetch("/api/gloves-for-sale");
      const data = await resp.json();

      const glove =
        data.gloves.find(g => g.slug === slug);

      if (!glove) {
        container.innerHTML = "<p>Glove not found.</p>";
        return;
      }

      container.innerHTML = `
        <h1>${glove.title}</h1>

        <div class="sale-detail-gallery">
          <img
            id="saleDetailMainPhoto"
            class="sale-detail-main-img"
            src="${glove.primaryPhoto || ""}"
            alt="${glove.title}"
          >
        
          <div class="sale-detail-thumbs">
            ${(glove.photos || []).map(photo => `
              <button
                type="button"
                class="sale-detail-thumb"
                onclick="document.getElementById('saleDetailMainPhoto').src='${photo.url}'"
              >
                <img
                  src="${photo.url}"
                  alt=""
                >
              </button>
            `).join("")}
          </div>
        </div>

        <p><strong>Price:</strong> $${Number(glove.price).toFixed(2)}</p>
        <p><strong>Brand:</strong> ${glove.brand || ""}</p>
        <p><strong>Model:</strong> ${glove.model || ""}</p>
        <p><strong>Size:</strong> ${glove.gloveSize || ""}</p>
        <p><strong>Position:</strong> ${glove.position || ""}</p>
        <p><strong>Web:</strong> ${glove.web || ""}</p>
        <p><strong>Throw Hand:</strong> ${glove.throwHand || ""}</p>
        <p><strong>Condition:</strong> ${glove.condition || ""}</p>
        <p>${glove.description || ""}</p>
      `;
    } catch (err) {
      container.innerHTML = `<p>${err.message}</p>`;
    }
  }

  loadGlove();
</script>
