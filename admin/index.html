<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Murph's Mitt Maintenance Orders</title>
  <link rel="stylesheet" href="admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside id="sideMenu" class="side-menu">
      <div class="side-menu-header">
        <div class="brand-row">
          <img src="/assets/img/logo.png" alt="Murph's Mitt Maintenance logo" class="brand-logo">
          <div>
            <div class="brand-title">Murph's Mitts</div>
            <div class="brand-subtitle">Orders</div>
          </div>
        </div>
        <button id="closeMenuBtn" class="icon-btn mobile-only" aria-label="Close menu">✕</button>
      </div>

      <nav class="side-nav">
        <div class="nav-group">
          <button class="nav-parent" type="button" data-tree-toggle="orders" aria-expanded="true">
            <span>Orders</span>
            <span class="nav-caret" aria-hidden="true">▾</span>
          </button>

          <div class="nav-children" data-tree="orders">
            <button class="nav-link active" data-view="current">Current Orders</button>
            <button class="nav-link" data-view="progress">In Progress</button>
            <button class="nav-link" data-view="estimate">Estimate Sent</button>
            <button class="nav-link" data-view="approved">Customer Approved</button>
            <button class="nav-link" data-view="customer-response">Pending Response</button>
            <button class="nav-link" data-view="transit">In Transit to Me</button>
            <button class="nav-link" data-view="waiting">Waiting on Lace/Parts</button>
            <button class="nav-link" data-view="ready">Ready to Go</button>
            <button class="nav-link" data-view="hold">On Hold</button>
            <button class="nav-link" data-view="completed">Completed</button>
            <button class="nav-link" data-view="all">All Orders</button>
          </div>
        </div>

        <button class="nav-link nav-main" data-view="inventory">Lace Inventory</button>
        <button class="nav-link nav-main" data-view="upload">Upload</button>
        <button class="nav-link nav-main" data-view="gloves-sale">Gloves For Sale</button>
      </nav>
    </aside>

    <div id="menuBackdrop" class="menu-backdrop"></div>

    <main class="main-panel">
      <section id="loginView" class="view active">
        <div class="card login-card">
          <h1>Murph's Mitts Order Tracker</h1>
          <p class="muted">Enter PIN.</p>
          <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" />
          <p id="loginStatus" class="status"></p>
        </div>
      </section>

      <section id="dashboardView" class="view">
        <header class="topbar">
          <div class="topbar-left">
            <button id="menuBtn" class="icon-btn" aria-label="Open menu">☰</button>
            <div>
              <h1 id="viewTitle">Current Orders</h1>
              <p id="orderCount" class="muted"></p>
            </div>
          </div>
          <div style="display:flex; gap:8px;">
            <button id="refreshBtn" class="secondary">🔄</button>
            <button id="logoutBtn" class="secondary">Log Out</button>
          </div>
        </header>

        <div class="toolbar">
          <input id="searchInput" type="search" placeholder="Search by order #, name, email..." />
        </div>

        <div id="ordersList" class="orders-list"></div>
      </section>

      <section id="uploadView" class="view">
        <header class="topbar">
          <div class="topbar-left">
            <button id="uploadMenuBtn" class="icon-btn" aria-label="Open menu">☰</button>
            <div>
              <h1>Upload</h1>
              <p id="uploadCount" class="muted">Gallery photos</p>
            </div>
          </div>

          <div style="display:flex; gap:8px;">
            <button id="uploadRefreshBtn" class="secondary">🔄</button>
            <button id="uploadLogoutBtn" class="secondary">Log Out</button>
          </div>
        </header>

        <div class="upload-panel">
          <div class="upload-card">
            <h2>Website Gallery</h2>
            <p class="muted">
              Choose a section, then upload glove photos.
            </p>

            <div class="detail-block">
              <div class="label">Gallery Section</div>
              <select id="gallerySectionSelect">
                <option value="fielding-gloves">Fielding Gloves</option>
                <option value="catchers-mitts">Catcher's Mitts</option>
                <option value="first-base-mitts">First Base Mitts</option>
                <option value="custom-color-relaces">Custom Color Relaces</option>
                <option value="vintage">Vintage</option>
              </select>
            </div>

            <label class="upload-drop" for="galleryUploadInput">
              <span class="upload-drop-title">Choose gallery photos</span>
              <span class="upload-drop-note">Select one or multiple photos, then review before uploading.</span>
            </label>

            <input id="galleryUploadInput" type="file" accept="image/*" multiple>

            <div id="galleryUploadPreview" class="upload-preview-grid"></div>

            <div class="upload-actions">
              <button id="galleryUploadBtn" class="secondary" type="button" disabled>
                Upload Selected Photos
              </button>

              <button id="galleryClearBtn" class="secondary" type="button" disabled>
                Clear Selection
              </button>
            </div>

            <p id="galleryUploadStatus" class="upload-status">
              No photos selected.
            </p>
          </div>
        </div>
      </section>

      <section id="saleGlovesView" class="view">
        <header class="topbar">
          <div class="topbar-left">
            <button id="saleGlovesMenuBtn" class="icon-btn" aria-label="Open menu">☰</button>
            <div>
              <h1>Gloves For Sale</h1>
              <p id="saleGlovesCount" class="muted">Manage glove listings</p>
            </div>
          </div>

          <div style="display:flex; gap:8px;">
            <button id="addSaleGloveBtn" class="secondary">+ Add</button>
            <button id="saleGlovesRefreshBtn" class="secondary">🔄</button>
            <button id="saleGlovesLogoutBtn" class="secondary">Log Out</button>
          </div>
        </header>

        <div id="saleGlovesList" class="orders-list"></div>
      </section>

      <section id="detailView" class="view">
        <header class="topbar detail-topbar">
          <div class="topbar-left">
            <button id="backBtn" class="secondary">Back</button>
            <div>
              <h1 id="detailTitle">Order Detail</h1>
            </div>
          </div>

          <div class="detail-topbar-actions">
            <p id="saveStatus" class="status" aria-live="polite"></p>
            <button id="saveOrderBtn" type="button">Save</button>
          </div>
        </header>

        <div id="orderDetail" class="detail-card"></div>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
