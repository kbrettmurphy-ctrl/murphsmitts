<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Murph's Mitts Admin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside id="sideMenu" class="side-menu">
      <div class="side-menu-header">
        <div class="brand-row">
          <img src="/assets/img/logo.png" alt="Murph's Mitt Maintenance logo" class="brand-logo">
          <div>
            <div class="brand-title">Murph's Mitts</div>
            <div class="brand-subtitle">Admin</div>
          </div>
        </div>
        <button id="closeMenuBtn" class="icon-btn mobile-only" aria-label="Close menu">✕</button>
      </div>

      <nav class="side-nav">
        <button class="nav-link nav-main active" data-view="current">Orders</button>
        <button class="nav-link nav-main" data-view="map">Map</button>
        <button class="nav-link nav-main" data-view="inventory">Lace Inventory</button>
        <button class="nav-link nav-main" data-view="upload">Upload</button>
        <button class="nav-link nav-main" data-view="gloves-sale">Gloves For Sale</button>
      </nav>
    </aside>

    <div id="menuBackdrop" class="menu-backdrop"></div>

    <main class="main-panel">
      <section id="loginView" class="view active">
        <div class="card login-card">
          <h1>Murph's Mitts Order Tracker</h1>
          <p class="muted">Enter PIN.</p>
          <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" />
          <p id="loginStatus" class="status"></p>
        </div>
      </section>

      <section id="dashboardView" class="view">
        <header class="topbar">
          <div class="topbar-left">
            <button id="menuBtn" class="icon-btn" aria-label="Open menu">☰</button>
            <div>
              <h1 id="viewTitle">Orders</h1>
              <p id="orderCount" class="muted"></p>
            </div>
          </div>
          <div class="topbar-actions">
            <button id="orderFilterToggleBtn" class="secondary topbar-icon-action order-filter-toggle" type="button" aria-label="Order filters" aria-expanded="false" aria-controls="orderFilterPopover">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 7h16"></path>
                <circle cx="9" cy="7" r="2"></circle>
                <path d="M4 17h16"></path>
                <circle cx="15" cy="17" r="2"></circle>
              </svg>
            </button>
            <button id="inventoryFilterToggleBtn" class="secondary topbar-icon-action inventory-filter-toggle" type="button" aria-label="Inventory filters" aria-expanded="false" aria-controls="inventoryFilterPopover" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 7h16"></path>
                <circle cx="9" cy="7" r="2"></circle>
                <path d="M4 17h16"></path>
                <circle cx="15" cy="17" r="2"></circle>
              </svg>
            </button>
            <button id="orderNewBtn" class="secondary topbar-icon-action order-new-btn" type="button" aria-label="New order">+</button>
            <button id="inventoryAddBtn" class="secondary topbar-icon-action inventory-add-btn" type="button" aria-label="Add lace color" hidden>+</button>
            <button id="searchToggleBtn" class="secondary topbar-icon-action" type="button" aria-label="Search orders" aria-expanded="false" aria-controls="searchToolbar">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="11" cy="11" r="6"></circle>
                <path d="m16 16 4 4"></path>
              </svg>
            </button>
            <button id="logoutBtn" class="secondary logout-action" type="button" aria-label="Log out">
              <span class="logout-action-text">Log Out</span>
              <svg class="logout-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M10 6H6.8A2.8 2.8 0 0 0 4 8.8v6.4A2.8 2.8 0 0 0 6.8 18H10"></path>
                <path d="M14 8l4 4-4 4"></path>
                <path d="M8.8 12H18"></path>
              </svg>
            </button>
            <div id="inventoryFilterPopover" class="admin-filter-popover inventory-filter-popover" hidden>
              <div class="admin-filter-list inventory-filter-list" role="group" aria-label="Inventory filter">
                <button id="inventoryAllBtn" type="button">Active</button>
                <button id="inventoryNeedsOrderBtn" type="button">Needs Order</button>
                <button id="inventoryHiddenBtn" type="button">Hidden</button>
              </div>
            </div>
            <div id="orderFilterPopover" class="admin-filter-popover order-filter-popover" hidden>
              <div class="admin-filter-list order-filter-list" role="menu" aria-label="Order filters">
                <button type="button" role="menuitemradio" data-order-filter="current">Current</button>
                <button type="button" role="menuitemradio" data-order-filter="all">All</button>
                <button type="button" role="menuitemradio" data-order-filter="estimate">Estimate Sent</button>
                <button type="button" role="menuitemradio" data-order-filter="customer-response">Pending Response</button>
                <button type="button" role="menuitemradio" data-order-filter="approved">Customer Approved</button>
                <button type="button" role="menuitemradio" data-order-filter="transit">In Transit to Me</button>
                <button type="button" role="menuitemradio" data-order-filter="progress">In Progress</button>
                <button type="button" role="menuitemradio" data-order-filter="waiting">Waiting Parts</button>
                <button type="button" role="menuitemradio" data-order-filter="ready">Ready to Go</button>
                <button type="button" role="menuitemradio" data-order-filter="hold">On Hold</button>
                <button type="button" role="menuitemradio" data-order-filter="completed">Completed</button>
              </div>
            </div>
          </div>
        </header>

        <div id="searchToolbar" class="toolbar search-toolbar is-collapsed">
          <div class="search-control">
            <div class="search-field-shell">
              <svg class="search-field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="11" cy="11" r="6"></circle>
                <path d="m16 16 4 4"></path>
              </svg>
              <input id="searchInput" type="search" placeholder="Search orders" autocomplete="off" enterkeyhint="search" />
              <button id="searchClearBtn" class="search-clear-btn" type="button" aria-label="Clear search" hidden>×</button>
            </div>
            <button id="searchCloseBtn" class="search-close-btn" type="button">Cancel</button>
          </div>
        </div>

        <div id="ordersList" class="orders-list"></div>
      </section>

      <section id="mapView" class="view">
        <header class="topbar">
          <div class="topbar-left">
            <button id="mapMenuBtn" class="icon-btn" aria-label="Open menu">☰</button>
            <div>
              <h1>Map</h1>
              <p id="mapCount" class="muted">Customer reach</p>
            </div>
          </div>

          <div class="topbar-actions">
            <button id="mapLogoutBtn" class="secondary logout-action" type="button" aria-label="Log out">
              <span class="logout-action-text">Log Out</span>
              <svg class="logout-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M10 6H6.8A2.8 2.8 0 0 0 4 8.8v6.4A2.8 2.8 0 0 0 6.8 18H10"></path>
                <path d="M14 8l4 4-4 4"></path>
                <path d="M8.8 12H18"></path>
              </svg>
            </button>
          </div>
        </header>

        <div class="map-panel">
          <div class="map-card">
            <div class="map-header-row">
              <div>
                <h2>Shipped Glove Map</h2>
                <p id="mapStatus" class="muted">Loading map...</p>
              </div>
            </div>
            <div id="mapUnmappedList" class="map-unmapped-list" hidden></div>
            <div id="orderMap" class="order-map" aria-label="Map of shipped glove order locations"></div>
          </div>
        </div>
      </section>

      <section id="uploadView" class="view">
        <header class="topbar">
          <div class="topbar-left">
            <button id="uploadMenuBtn" class="icon-btn" aria-label="Open menu">☰</button>
            <div>
              <h1>Upload</h1>
              <p id="uploadCount" class="muted">Gallery photos</p>
            </div>
          </div>

          <div class="topbar-actions">
            <button id="uploadLogoutBtn" class="secondary logout-action" type="button" aria-label="Log out">
              <span class="logout-action-text">Log Out</span>
              <svg class="logout-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M10 6H6.8A2.8 2.8 0 0 0 4 8.8v6.4A2.8 2.8 0 0 0 6.8 18H10"></path>
                <path d="M14 8l4 4-4 4"></path>
                <path d="M8.8 12H18"></path>
              </svg>
            </button>
          </div>
        </header>

        <div class="upload-panel">
          <div class="upload-card gallery-upload-card">
            <div class="upload-card-heading">
              <div>
                <h2>Website Gallery</h2>
                <p class="muted">
                  Choose a section, then upload glove photos.
                </p>
              </div>
            </div>

            <div class="detail-block upload-section-block">
              <label class="label" for="gallerySectionSelect">Gallery Section</label>
              <select id="gallerySectionSelect">
                <option value="fielding-gloves">Fielding Gloves</option>
                <option value="catchers-mitts">Catcher's Mitts</option>
                <option value="first-base-mitts">First Base Mitts</option>
                <option value="custom-color-relaces">Custom Color Relaces</option>
                <option value="vintage">Vintage</option>
              </select>
            </div>

            <label class="upload-drop" for="galleryUploadInput">
              <span class="upload-drop-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <rect x="4" y="5" width="16" height="14" rx="3"></rect>
                  <circle cx="9" cy="10" r="1.6"></circle>
                  <path d="m7 17 4.2-4.2a1.8 1.8 0 0 1 2.5 0L17 16"></path>
                </svg>
              </span>
              <span class="upload-drop-title">Choose Photos</span>
              <span class="upload-drop-note">Select one or multiple photos to review before uploading.</span>
            </label>

            <input id="galleryUploadInput" type="file" accept="image/*" multiple>

            <div id="galleryUploadPreview" class="upload-preview-grid"></div>

            <div class="upload-actions">
              <button id="galleryUploadBtn" class="secondary upload-primary" type="button" disabled>
                Upload
              </button>

              <button id="galleryClearBtn" class="secondary upload-clear" type="button" disabled>
                Clear
              </button>
            </div>

            <p id="galleryUploadStatus" class="upload-status" aria-live="polite">
              No photos selected.
            </p>
          </div>
        </div>
      </section>

      <section id="saleGlovesView" class="view">
        <header class="topbar">
          <div class="topbar-left">
            <button id="saleGlovesMenuBtn" class="icon-btn" aria-label="Open menu">☰</button>
            <div>
              <h1>Store</h1>
              <p id="saleGlovesCount" class="muted">Manage glove listings</p>
            </div>
          </div>

          <div class="topbar-actions">
            <button id="addSaleGloveBtn" class="secondary sale-add-btn">+ Add</button>
            <button id="saleGlovesLogoutBtn" class="secondary logout-action" type="button" aria-label="Log out">
              <span class="logout-action-text">Log Out</span>
              <svg class="logout-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M10 6H6.8A2.8 2.8 0 0 0 4 8.8v6.4A2.8 2.8 0 0 0 6.8 18H10"></path>
                <path d="M14 8l4 4-4 4"></path>
                <path d="M8.8 12H18"></path>
              </svg>
            </button>
          </div>
        </header>

        <div id="saleGlovesList" class="orders-list"></div>
      </section>

      <section id="detailView" class="view">
        <header class="topbar detail-topbar">
          <div class="topbar-left">
            <button id="backBtn" class="secondary">Back</button>
            <div>
              <h1 id="detailTitle">Order Detail</h1>
            </div>
          </div>

          <div class="detail-topbar-actions">
            <p id="saveStatus" class="status" aria-live="polite"></p>
            <button id="saveOrderBtn" type="button">Save</button>
          </div>
        </header>

        <div id="orderDetail" class="detail-card"></div>
      </section>
      <div id="pullRefreshIndicator" class="pull-refresh-indicator" aria-hidden="true">
        <span class="pull-refresh-spinner" aria-hidden="true"></span>
        <span id="pullRefreshText">Pull to refresh</span>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="admin.js"></script>
</body>
</html>
